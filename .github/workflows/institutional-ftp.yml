name: Deploy ADPeak to Institutional FTP

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      server_dir:
        description: FTP target directory
        required: true
        default: adpeak/
      base_path:
        description: Public base path
        required: true
        default: /adpeak/

permissions:
  contents: read

env:
  INSTITUTIONAL_BASE_PATH: ${{ github.event.inputs.base_path || '/adpeak/' }}
  INSTITUTIONAL_SERVER_DIR: ${{ github.event.inputs.server_dir || 'adpeak/' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run check

      - name: Build frontend for institutional subdirectory
        run: npm --workspace @adpeak/frontend run build
        env:
          VITE_BASE_PATH: ${{ env.INSTITUTIONAL_BASE_PATH }}
          VITE_API_DISABLED: "true"

      - name: Add Apache SPA fallback
        shell: bash
        run: |
          cp apps/frontend/dist/index.html apps/frontend/dist/404.html
          cat > apps/frontend/dist/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase ${{ env.INSTITUTIONAL_BASE_PATH }}
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . ${{ env.INSTITUTIONAL_BASE_PATH }}index.html [L]
          </IfModule>
          HTACCESS

      - name: Deploy via FTP
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.INSTITUTIONAL_FTP_HOST }}
          username: ${{ secrets.INSTITUTIONAL_FTP_USER }}
          password: ${{ secrets.INSTITUTIONAL_FTP_PASSWORD }}
          local-dir: apps/frontend/dist/
          server-dir: ${{ env.INSTITUTIONAL_SERVER_DIR }}
          protocol: ftp
          dangerous-clean-slate: false

      - name: Deploy via SSH fallback
        if: steps.ftp_deploy.outcome == 'failure'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.INSTITUTIONAL_FTP_HOST }}
          SSH_USER: ${{ secrets.INSTITUTIONAL_SSH_USER }}
          SSHPASS: ${{ secrets.INSTITUTIONAL_SSH_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          remote_base="${INSTITUTIONAL_SERVER_DIR%/}"
          candidates=(
            "public_html/${remote_base}"
            "www/${remote_base}"
            "htdocs/${remote_base}"
            "html/${remote_base}"
            "${remote_base}"
          )
          remote_dir=""

          for candidate in "${candidates[@]}"; do
            if timeout 35 sshpass -e ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 \
              "${SSH_USER}@${SSH_HOST}" \
              "mkdir -p '${candidate}' && test -d '${candidate}'"; then
              remote_dir="${candidate}"
              break
            fi
          done

          if [ -z "${remote_dir}" ]; then
            echo "No SSH target directory could be prepared."
            exit 1
          fi

          tar -C apps/frontend/dist -czf - . | timeout 90 sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" \
            "tar -xzf - -C '${remote_dir}'"
