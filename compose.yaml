name: adpeak-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigi_poa_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sigi_poa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigi_poa_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: npm run dev:backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sigi_poa}:${POSTGRES_PASSWORD:-sigi_poa_dev_password}@db:5432/${POSTGRES_DB:-sigi_poa_dev}"
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.BACKEND_PORT || '8000') + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command:
      [
        "npm",
        "--workspace",
        "@adpeak/frontend",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0"
      ]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  postgres_data:
